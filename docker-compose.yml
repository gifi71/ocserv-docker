---

services:
  ocserv:
    image: ghcr.io/gifi71/ocserv-docker:0.1.0
    container_name: ocserv
    restart: unless-stopped

    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    network_mode: host

    env_file:
      - .env  # copy from .env.example
    volumes:
      - ./config:/etc/ocserv:ro
    security_opt:
      - no-new-privileges

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ## Bridge mode (alternative to network_mode: host):
    ## Comment out 'network_mode: host' and uncomment the following:
    # ports:
    #   - "443:443/tcp"
    #   - "443:443/udp"
    #   # - "8000:8000/tcp"  # ocserv-exporter metrics
    # sysctls:
    #   net.ipv4.ip_forward: "1"
